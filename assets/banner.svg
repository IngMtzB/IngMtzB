<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Carlos Alberto Martinez Barrera - Programmer from Mexico">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b2e"/>
      <stop offset="0.6" stop-color="#2d2347"/>
      <stop offset="1" stop-color="#4a2c6b"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff79c6"/>
      <stop offset="1" stop-color="#bd93f9"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1f6b"/>
      <stop offset="1" stop-color="#c792ea"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d7be6"/>
      <stop offset="1" stop-color="#6c4fc4"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#f8f8f2">
      <circle cx="80" cy="40" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="275" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="30" r="1.8"><animate attributeName="opacity" values="1;.3;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="285" r="1.3"><animate attributeName="opacity" values=".2;1;.2" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="50" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="250" r="1.1"><animate attributeName="opacity" values=".4;1;.4" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="40" r="1.6"><animate attributeName="opacity" values="1;.3;1" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="1160" cy="260" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="830" cy="30" r="1.3"><animate attributeName="opacity" values=".5;1;.5" dur="3s" repeatCount="indefinite"/></circle>
    </g>
    <path d="M790 70 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#f1fa8c" opacity=".8">
      <animate attributeName="opacity" values=".8;.2;.8" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M1120 180 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#8be9fd" opacity=".8">
      <animate attributeName="opacity" values=".2;.9;.2" dur="2.7s" repeatCount="indefinite"/>
    </path>

    <!-- crescent moon -->
    <mask id="crescent">
      <circle cx="1090" cy="70" r="28" fill="#fff"/>
      <circle cx="1102" cy="62" r="26" fill="#000"/>
    </mask>
    <circle cx="1090" cy="70" r="28" fill="#f8f8f2" opacity=".9" mask="url(#crescent)"/>

    <!-- text -->
    <text x="64" y="118" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-size="22" fill="#8be9fd">Hi there, I'm</text>
    <text x="64" y="166" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-size="44" font-weight="700" fill="url(#name)">Carlos Alberto Martinez</text>
    <text x="64" y="210" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-size="22" fill="#f8f8f2">Programmer from Mexico · Building things for the web</text>
    <text x="64" y="250" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#6272a4">const me = { coffee: Infinity, bugs: 0 }<tspan fill="#ff79c6">▌<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/></tspan></text>

    <!-- floating hearts -->
    <g fill="#ff79c6">
      <path d="M0 3 C0 -1 5 -2 6 2 C7 -2 12 -1 12 3 C12 7 6 10 6 12 C6 10 0 7 0 3z" transform="translate(860 230)">
        <animateTransform attributeName="transform" type="translate" values="860 230;850 120;860 40" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M0 3 C0 -1 5 -2 6 2 C7 -2 12 -1 12 3 C12 7 6 10 6 12 C6 10 0 7 0 3z" transform="translate(1060 240)">
        <animateTransform attributeName="transform" type="translate" values="1060 240;1072 150;1062 60" dur="6s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="6s" begin="2s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- girl -->
    <g>
      <!-- back hair -->
      <path d="M885 160 C875 35 1045 35 1035 160 C1048 215 1045 275 1030 320 L890 320 C875 275 872 215 885 160z" fill="url(#hair)"/>

      <!-- body (hoodie) -->
      <path d="M918 206 Q960 198 1002 206 L1026 320 L894 320z" fill="#ff79c6"/>
      <path d="M945 205 L960 225 L975 205" fill="none" stroke="#f8f8f2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- waving arm -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-10 1000 225;12 1000 225;-10 1000 225" dur="1.2s" repeatCount="indefinite"/>
        <path d="M1000 225 L1046 172" stroke="#ff79c6" stroke-width="18" stroke-linecap="round"/>
        <circle cx="1050" cy="166" r="11" fill="#ffe3d3"/>
      </g>

      <!-- head -->
      <ellipse cx="960" cy="150" rx="62" ry="58" fill="#ffe3d3"/>

      <!-- eyes open -->
      <g>
        <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;.94;.97;1" dur="4s" repeatCount="indefinite"/>
        <ellipse cx="935" cy="165" rx="13" ry="16" fill="#fff"/>
        <ellipse cx="935" cy="166" rx="11" ry="14" fill="url(#iris)"/>
        <ellipse cx="935" cy="168" rx="5" ry="7" fill="#1e1030"/>
        <circle cx="931" cy="159" r="4" fill="#fff"/>
        <circle cx="939" cy="173" r="2" fill="#fff"/>
        <ellipse cx="985" cy="165" rx="13" ry="16" fill="#fff"/>
        <ellipse cx="985" cy="166" rx="11" ry="14" fill="url(#iris)"/>
        <ellipse cx="985" cy="168" rx="5" ry="7" fill="#1e1030"/>
        <circle cx="981" cy="159" r="4" fill="#fff"/>
        <circle cx="989" cy="173" r="2" fill="#fff"/>
      </g>
      <!-- eyes closed (blink) -->
      <g fill="none" stroke="#2a1840" stroke-width="3" stroke-linecap="round" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.94;.97;1" dur="4s" repeatCount="indefinite"/>
        <path d="M922 166 Q935 174 948 166"/>
        <path d="M972 166 Q985 174 998 166"/>
      </g>
      <!-- lashes -->
      <g fill="none" stroke="#2a1840" stroke-width="3.5" stroke-linecap="round">
        <path d="M919 154 Q935 144 951 152"/>
        <path d="M969 152 Q985 144 1001 154"/>
      </g>

      <!-- blush & mouth -->
      <ellipse cx="917" cy="186" rx="10" ry="5" fill="#ff8fab" opacity=".55"/>
      <ellipse cx="1003" cy="186" rx="10" ry="5" fill="#ff8fab" opacity=".55"/>
      <path d="M952 190 Q956 196 960 191 Q964 196 968 190" fill="none" stroke="#8a3b55" stroke-width="2" stroke-linecap="round"/>

      <!-- bangs & side locks -->
      <path d="M896 162 C885 40 1035 40 1024 162 Q1016 140 1008 130 Q1002 140 998 150 Q994 130 980 118 Q978 134 972 146 Q966 126 950 116 Q952 134 946 146 Q938 128 924 124 Q926 140 920 152 Q912 142 906 132z" fill="url(#hair)"/>
      <path d="M898 145 Q884 200 900 248 Q904 205 914 168z" fill="#7d5fd6"/>
      <path d="M1022 145 Q1036 200 1020 248 Q1016 205 1006 168z" fill="#7d5fd6"/>
      <path d="M958 76 Q968 44 994 52 Q972 56 966 80z" fill="#9d7be6"/>

      <!-- star hair clip -->
      <path d="M1012 100 l4 8 9 1 -7 6 2 9 -8 -5 -8 5 2 -9 -7 -6 9 -1z" fill="#f1fa8c"/>

      <!-- laptop (lid facing us) -->
      <rect x="902" y="250" width="116" height="74" rx="8" fill="#e6e6f0"/>
      <text x="960" y="292" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#bd93f9">&lt;/&gt;</text>
      <circle cx="902" cy="268" r="10" fill="#ffe3d3"/>
    </g>

    <!-- speech bubble -->
    <g>
      <rect x="1068" y="112" width="70" height="34" rx="17" fill="#f8f8f2"/>
      <path d="M1076 140 L1066 154 L1088 144z" fill="#f8f8f2"/>
      <text x="1103" y="135" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="16" font-weight="700" fill="#ff79c6">Hi! ♡</text>
    </g>
  </g>
</svg>
